<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liturgio — Chant Index Review</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/auth.js"></script>
  <link rel="stylesheet" href="/static/gr-index.css">
</head>
<body>
<div id="app">
  <header>
    <h1>Liturgio — Chant Index Review</h1>
    <nav id="page-nav">
      <a href="/">Chant Browser</a>
      <a href="/editor">Chant Editor</a>
      <a href="/sources">Source Review</a>
      <a href="/assignments">Assignment Review</a>
      <a href="/mergers">Merge Manager</a>
      <a href="/gr-index" class="active">GR Index</a>
      <a href="/intake">Intake</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/day">Day View</a>
    </nav>
    <div id="gri-stats-badge"></div>
  </header>

  <div id="main">
    <!-- ── Left sidebar ── -->
    <aside id="sidebar">
      <div id="filter-area">
        <div class="filter-group">
          <label class="filter-label" for="gri-book">Book</label>
          <select id="gri-book"></select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Status</label>
          <div class="chips" id="status-chips">
            <button class="chip active" data-status="">All</button>
            <button class="chip" data-status="resolved">Resolved</button>
            <button class="chip" data-status="resolved_with_difficulty">Difficult</button>
            <button class="chip" data-status="ambiguous">Ambiguous</button>
            <button class="chip" data-status="unmatched">Unmatched</button>
            <button class="chip" data-status="reviewed">Reviewed</button>
            <button class="chip" data-status="(none)">None</button>
          </div>
        </div>
      </div>
      <div id="gri-search-area">
        <input type="search" id="gri-search" placeholder="Search incipit…" autocomplete="off">
      </div>
      <div id="gri-list-count"></div>
      <ul id="gri-list"></ul>
    </aside>

    <!-- ── Right panel ── -->
    <main id="gri-panel">
      <div id="gri-empty-state">
        <p>Select an entry from the list to review it</p>
      </div>

      <div id="gri-editor" hidden>

        <!-- Header -->
        <div id="gri-header">
          <div id="gri-title"></div>
          <div id="gri-meta"></div>
        </div>

        <!-- Two page images -->
        <div id="gri-images-row">
          <div class="gri-img-box">
            <div class="pane-label" id="gri-img-label-a">Page</div>
            <div class="gri-img-wrap">
              <img id="gri-page-img-a" alt="Book page">
            </div>
          </div>
          <div class="gri-img-box">
            <div class="pane-label" id="gri-img-label-b">Next page</div>
            <div class="gri-img-wrap">
              <img id="gri-page-img-b" alt="Book next page">
            </div>
          </div>
        </div>

        <!-- Assignment display -->
        <div id="gri-assignment-area">
          <div class="pane-label">Current assignment</div>
          <div id="gri-assignment-none" class="gri-assign-none">No assignment</div>
          <div id="gri-assignment-display" hidden>
            <div id="gri-assign-meta"></div>
            <div id="gri-assign-engraving"></div>
          </div>
        </div>

        <!-- Action bar -->
        <div id="gri-actions">
          <button id="gri-btn-browse" class="btn-secondary">Browse gregobase…</button>
          <button id="gri-btn-new" class="btn-secondary">New chant…</button>
          <button id="gri-btn-reviewed" class="btn-primary">Mark reviewed</button>
          <button id="gri-btn-clear" class="btn-delete" hidden>Clear assignment</button>
          <span id="gri-msg"></span>
        </div>

        <!-- Browse panel -->
        <div id="gri-browse-panel" hidden></div>

        <!-- New chant panel -->
        <div id="gri-new-panel" hidden></div>

      </div><!-- /gri-editor -->
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/gh/drj-chantschool/exsurge@v2.2.0-liturgio.2/dist/exsurge.min.js"></script>
<script src="/static/chant-render.js"></script>
<script src="/static/chant-assign-panels.js"></script>
<script src="/static/gr-index.js"></script>
</body>
</html>
